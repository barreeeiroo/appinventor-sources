# Tomcat-specific configuration for MIT App Inventor
# This file contains properties that replace App Engine system properties

# Application environment and version
appinventor.environment=development
appinventor.version=1.0.0
appinventor.runtime.version=tomcat

# Authentication configuration
auth.usegoogle=true
auth.uselocal=true

# Local authentication settings
localauth.mailserver=
localauth.mailserver.password=

# Build server configuration
build.server.host=localhost:9990
build.server.password=
build2.server.host=
build2.server.password=
ios.build.server.host=localhost:9990

# Database provider (use DynamoDB, local, or other supported providers)
database.provider=ddb
# DynamoDB configuration (if using DynamoDB provider)
database.ddb.endpoint=http://localhost:8000
database.ddb.tablesregion=fakeRegion
database.ddb.accesskeyid=fakeMyKeyId
database.ddb.secretaccesskey=fakeSecretAccessKey

# File system provider (use S3, local, or other supported providers)
filesystem.provider=s3
# S3 configuration (if using S3 provider)
filesystem.s3.endpoint=http://localhost:9000
filesystem.s3.endpointpathstyle=true
filesystem.s3.bucketname=default
filesystem.s3.bucketregion=us-east-1
filesystem.s3.accesskeyid=minioadmin
filesystem.s3.secretaccesskey=minioadmin123

# Cache provider (use Redis, local, or other supported providers)
cache.provider=redis
# Redis configuration (if using Redis provider)
cache.redis.host=localhost:6379

# Session management (in minutes)
session.idletimeout=120
session.renew=30
session.noop=0

# Session keyfile path (Tomcat needs absolute path within webapp)
session.keyfile=/WEB-INF/authkey

# Feature flags
use.whitelist=false
require.tos=true
wifi.enabled=true
build.send.git.version=true

# External URLs
library.url=http://appinventor.mit.edu/explore/library
getstarted.url=http://appinventor.mit.edu/explore/get-started
tutorials.url=http://appinventor.mit.edu/explore/ai2/tutorials
extensions.url=http://appinventor.mit.edu/extensions
troubleshooting.url=http://appinventor.mit.edu/explore/ai2/support/troubleshooting
forums.url=https://community.appinventor.mit.edu
feedback.url=http://something.example.com
release.notes.url=http://appinventor.mit.edu/ai2/ReleaseNotes.html
tos.url=/about/termsofservice.html
logo.url=http://appinventor.mit.edu
guide.url=http://appinventor.mit.edu/explore/library
reference.components.url=/reference/components/

# CloudDB configuration
clouddb.server=
clouddb.uuid.secret=changeme!
clouddb.secret=changeme too!

# Firebase configuration
firebase.secret=
firebase.url=

# Project limits
project.maxsize=30

# HTTP configuration
http.keepAlive=true
http.maxConnections=5

# Message of the day
motd.check.interval.secs=0

# Service expiration
service.expires.time=

# ODE base URL (leave blank to use same host)
ode.base=